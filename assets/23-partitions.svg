<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="simple drawing: one disk split into partitions">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b4d"/><stop offset="1" stop-color="#1b2a6b"/></linearGradient>
<style>.p{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.55}}.g{animation:g 4s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}@keyframes g{0%{transform:scaleX(.05)}80%,100%{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){.p,.g{animation:none}}text{font-family:Arial,sans-serif;font-weight:700;fill:#f0f9ff}</style></defs>
<rect width="800" height="400" rx="24" fill="url(#bg)"/>
<rect x="24" y="20" width="170" height="38" rx="19" fill="#0b1230" stroke="#7dd3fc" stroke-width="2"/><text x="44" y="46" font-size="22" style="fill:#7dd3fc;font-weight:400">illustration</text>
<rect x="60" y="130" width="680" height="120" rx="18" fill="#16225c" stroke="#7dd3fc" stroke-width="5"/><rect x="75" y="145" width="290" height="90" rx="10" fill="#38bdf8"/><text x="220" y="200" font-size="34" text-anchor="middle" style="fill:#0b1230">C:</text><rect x="380" y="145" width="190" height="90" rx="10" fill="#818cf8"/><text x="475" y="200" font-size="34" text-anchor="middle" style="fill:#0b1230">D:</text><rect x="585" y="145" width="140" height="90" rx="10" fill="#0b1230" stroke="#fde68a" stroke-width="4" stroke-dasharray="10 8"/><text x="655" y="200" font-size="26" text-anchor="middle">Free</text><text x="60" y="320" font-size="30">MBR  or  GPT</text>
</svg>
