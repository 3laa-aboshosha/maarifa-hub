<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="step: log in with the username and password from the sticker">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b4d"/><stop offset="1" stop-color="#1b2a6b"/></linearGradient>
<style>.p{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.55}}.g{animation:g 4s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}@keyframes g{0%{transform:scaleX(.05)}80%,100%{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){.p,.g{animation:none}}text{font-family:Arial,sans-serif;font-weight:700;fill:#f0f9ff}</style></defs>
<rect width="800" height="400" rx="24" fill="url(#bg)"/>
<rect x="24" y="20" width="170" height="38" rx="19" fill="#0b1230" stroke="#7dd3fc" stroke-width="2"/><text x="44" y="46" font-size="22" style="fill:#7dd3fc;font-weight:400">illustration</text>
<rect x="150" y="90" width="500" height="270" rx="20" fill="#16225c" stroke="#7dd3fc" stroke-width="5"/>
<text x="400" y="145" font-size="34" text-anchor="middle">Router login</text>
<rect x="190" y="170" width="420" height="52" rx="12" fill="#1e3a8a" stroke="#7dd3fc" stroke-width="4"/><text x="212" y="205" font-size="26">Username</text>
<rect x="190" y="238" width="420" height="52" rx="12" fill="#1e3a8a" stroke="#7dd3fc" stroke-width="4"/><text x="212" y="273" font-size="26">Password</text>
<g class="p"><rect x="290" y="303" width="220" height="42" rx="21" fill="#1e3a8a" stroke="#fde68a" stroke-width="6"/><text x="400" y="333" font-size="26" text-anchor="middle">Login</text></g>
</svg>
