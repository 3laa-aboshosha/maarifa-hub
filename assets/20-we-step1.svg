<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="step: Wi-Fi name and password from the sticker under the router">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b4d"/><stop offset="1" stop-color="#1b2a6b"/></linearGradient>
<style>.p{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.55}}.g{animation:g 4s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}@keyframes g{0%{transform:scaleX(.05)}80%,100%{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){.p,.g{animation:none}}text{font-family:Arial,sans-serif;font-weight:700;fill:#f0f9ff}</style></defs>
<rect width="800" height="400" rx="24" fill="url(#bg)"/>
<rect x="24" y="20" width="170" height="38" rx="19" fill="#0b1230" stroke="#7dd3fc" stroke-width="2"/><text x="44" y="46" font-size="22" style="fill:#7dd3fc;font-weight:400">illustration</text>
<rect x="60" y="100" width="300" height="250" rx="20" fill="#16225c" stroke="#7dd3fc" stroke-width="5"/>
<text x="210" y="150" font-size="30" text-anchor="middle">Router</text>
<g class="p"><rect x="90" y="175" width="240" height="140" rx="12" fill="#1e3a8a" stroke="#fde68a" stroke-width="6"/><text x="110" y="218" font-size="26">Wi-Fi name</text><text x="110" y="258" font-size="26">Password</text><text x="110" y="298" font-size="26">Address</text></g>
<path d="M400 225H470" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round"/><path d="M455 205L475 225L455 245" fill="none" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="510" y="150" width="190" height="150" rx="16" fill="#16225c" stroke="#7dd3fc" stroke-width="5"/><path d="M545 200c35-30 85-30 120 0M562 222c25-20 55-20 80 0" fill="none" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/><circle cx="605" cy="250" r="9" fill="#fde68a"/>
</svg>
