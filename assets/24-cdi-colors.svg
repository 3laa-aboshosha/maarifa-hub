<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="drawing: health status colors Good Caution Bad Unknown">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b4d"/><stop offset="1" stop-color="#1b2a6b"/></linearGradient>
<style>.p{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.55}}.g{animation:g 4s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}@keyframes g{0%{transform:scaleX(.05)}80%,100%{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){.p,.g{animation:none}}text{font-family:Arial,sans-serif;font-weight:700;fill:#f0f9ff}</style></defs>
<rect width="800" height="400" rx="24" fill="url(#bg)"/>
<rect x="24" y="20" width="170" height="38" rx="19" fill="#0b1230" stroke="#7dd3fc" stroke-width="2"/><text x="44" y="46" font-size="22" style="fill:#7dd3fc;font-weight:400">illustration</text>
<rect x="40" y="150" width="150" height="140" rx="16" fill="#3b82f6"/><text x="115" y="232" font-size="32" text-anchor="middle" style="fill:#0b1230">Good</text><rect x="220" y="150" width="150" height="140" rx="16" fill="#facc15"/><text x="295" y="232" font-size="32" text-anchor="middle" style="fill:#0b1230">Caution</text><rect x="400" y="150" width="150" height="140" rx="16" fill="#ef4444"/><text x="475" y="232" font-size="32" text-anchor="middle" style="fill:#0b1230">Bad</text><rect x="580" y="150" width="150" height="140" rx="16" fill="#94a3b8"/><text x="655" y="232" font-size="32" text-anchor="middle" style="fill:#0b1230">Unknown</text><text x="400" y="350" font-size="28" text-anchor="middle">blue / yellow / red / gray</text>
</svg>
