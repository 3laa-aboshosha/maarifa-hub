<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="step: find the Wi-Fi settings and the admin password menu">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b4d"/><stop offset="1" stop-color="#1b2a6b"/></linearGradient>
<style>.p{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.55}}.g{animation:g 4s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}@keyframes g{0%{transform:scaleX(.05)}80%,100%{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){.p,.g{animation:none}}text{font-family:Arial,sans-serif;font-weight:700;fill:#f0f9ff}</style></defs>
<rect width="800" height="400" rx="24" fill="url(#bg)"/>
<rect x="24" y="20" width="170" height="38" rx="19" fill="#0b1230" stroke="#7dd3fc" stroke-width="2"/><text x="44" y="46" font-size="22" style="fill:#7dd3fc;font-weight:400">illustration</text>
<rect x="60" y="100" width="680" height="260" rx="20" fill="#16225c" stroke="#7dd3fc" stroke-width="5"/>
<rect x="60" y="100" width="220" height="260" rx="20" fill="#1e3a8a"/>
<text x="90" y="150" font-size="26">Status</text>
<g class="p"><rect x="75" y="172" width="190" height="48" rx="10" fill="#1e3a8a" stroke="#fde68a" stroke-width="6"/><text x="95" y="205" font-size="26">Wi-Fi</text></g>
<text x="90" y="262" font-size="26">Network</text><text x="90" y="312" font-size="26">Admin</text>
<rect x="320" y="150" width="360" height="22" rx="11" fill="#1e3a8a"/><rect x="320" y="200" width="300" height="22" rx="11" fill="#1e3a8a"/><rect x="320" y="250" width="330" height="22" rx="11" fill="#1e3a8a"/>
</svg>
