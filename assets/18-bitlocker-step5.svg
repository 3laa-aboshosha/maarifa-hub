<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="step 5: choose unlock method and save the recovery key">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b4d"/><stop offset="1" stop-color="#1b2a6b"/></linearGradient>
<style>.p{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.55}}.g{animation:g 4s ease-in-out infinite;transform-origin:0 0}@keyframes g{0%{transform:scaleX(.05)}80%,100%{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){.p,.g{animation:none}}text{font-family:Arial,sans-serif;font-weight:700;fill:#f0f9ff}</style></defs>
<rect width="800" height="400" rx="24" fill="url(#bg)"/>
<rect x="24" y="20" width="170" height="38" rx="19" fill="#0b1230" stroke="#7dd3fc" stroke-width="2"/><text x="44" y="46" font-size="22" style="fill:#7dd3fc;font-weight:400">illustration</text>
<rect x="60" y="100" width="680" height="250" rx="20" fill="#16225c" stroke="#7dd3fc" stroke-width="5"/>
<rect x="90" y="130" width="300" height="70" rx="14" fill="#1e3a8a" stroke="#7dd3fc" stroke-width="4"/><text x="240" y="177" font-size="34" text-anchor="middle">Password</text>
<rect x="90" y="225" width="300" height="70" rx="14" fill="#1e3a8a" stroke="#7dd3fc" stroke-width="4"/><text x="240" y="272" font-size="34" text-anchor="middle">Smart card</text>
<g class="p"><rect x="420" y="130" width="290" height="165" rx="16" fill="#1e3a8a" stroke="#fde68a" stroke-width="6"/><circle cx="480" cy="195" r="26" fill="none" stroke="#fde68a" stroke-width="9"/><path d="M506 195H600M580 195V225M598 195V215" stroke="#fde68a" stroke-width="9" stroke-linecap="round" fill="none"/><text x="565" y="270" font-size="30" text-anchor="middle">Recovery key</text></g>
</svg>
