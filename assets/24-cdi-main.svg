<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="drawing: CrystalDiskInfo main window with health status and temperature">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b4d"/><stop offset="1" stop-color="#1b2a6b"/></linearGradient>
<style>.p{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.55}}.g{animation:g 4s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}@keyframes g{0%{transform:scaleX(.05)}80%,100%{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){.p,.g{animation:none}}text{font-family:Arial,sans-serif;font-weight:700;fill:#f0f9ff}</style></defs>
<rect width="800" height="400" rx="24" fill="url(#bg)"/>
<rect x="24" y="20" width="170" height="38" rx="19" fill="#0b1230" stroke="#7dd3fc" stroke-width="2"/><text x="44" y="46" font-size="22" style="fill:#7dd3fc;font-weight:400">illustration</text>
<rect x="60" y="100" width="680" height="270" rx="20" fill="#0b1230" stroke="#7dd3fc" stroke-width="5"/><rect x="60" y="100" width="680" height="46" rx="20" fill="#1e3a8a"/><text x="90" y="133" font-size="24">CrystalDiskInfo</text><text x="90" y="190" font-size="28">Drive: HDD</text><g class="p"><rect x="90" y="210" width="290" height="130" rx="14" fill="#2563eb"/><text x="235" y="255" font-size="28" text-anchor="middle">Health Status</text><text x="235" y="310" font-size="44" text-anchor="middle">Good</text></g><rect x="410" y="210" width="290" height="130" rx="14" fill="#1e3a8a"/><text x="555" y="255" font-size="28" text-anchor="middle">Temperature</text><text x="555" y="310" font-size="44" text-anchor="middle">-- C</text>
</svg>
