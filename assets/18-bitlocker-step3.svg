<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="step 3: Removable data drives">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b4d"/><stop offset="1" stop-color="#1b2a6b"/></linearGradient>
<style>.p{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.55}}.g{animation:g 4s ease-in-out infinite;transform-origin:0 0}@keyframes g{0%{transform:scaleX(.05)}80%,100%{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){.p,.g{animation:none}}text{font-family:Arial,sans-serif;font-weight:700;fill:#f0f9ff}</style></defs>
<rect width="800" height="400" rx="24" fill="url(#bg)"/>
<rect x="24" y="20" width="170" height="38" rx="19" fill="#0b1230" stroke="#7dd3fc" stroke-width="2"/><text x="44" y="46" font-size="22" style="fill:#7dd3fc;font-weight:400">illustration</text>
<rect x="60" y="100" width="680" height="260" rx="20" fill="#16225c" stroke="#7dd3fc" stroke-width="5"/>
<rect x="90" y="130" width="520" height="22" rx="11" fill="#1e3a8a"/><rect x="90" y="180" width="400" height="22" rx="11" fill="#1e3a8a"/>
<g class="p"><rect x="80" y="235" width="640" height="105" rx="16" fill="#1e3a8a" stroke="#fde68a" stroke-width="6"/><text x="105" y="283" font-size="38">Removable data drives</text><rect x="105" y="300" width="60" height="26" rx="6" fill="#38bdf8"/><text x="185" y="322" font-size="26">USB drive</text></g>
</svg>
