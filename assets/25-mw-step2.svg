<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="step: offline scan Scan now then restart">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b4d"/><stop offset="1" stop-color="#1b2a6b"/></linearGradient>
<style>.p{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.55}}.g{animation:g 4s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}@keyframes g{0%{transform:scaleX(.05)}80%,100%{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){.p,.g{animation:none}}text{font-family:Arial,sans-serif;font-weight:700;fill:#f0f9ff}</style></defs>
<rect width="800" height="400" rx="24" fill="url(#bg)"/>
<rect x="24" y="20" width="170" height="38" rx="19" fill="#0b1230" stroke="#7dd3fc" stroke-width="2"/><text x="44" y="46" font-size="22" style="fill:#7dd3fc;font-weight:400">illustration</text>
<rect x="60" y="100" width="680" height="270" rx="20" fill="#0b1230" stroke="#7dd3fc" stroke-width="5"/><rect x="60" y="100" width="680" height="46" rx="20" fill="#1e3a8a"/><text x="90" y="133" font-size="24">Offline scan</text><text x="100" y="190" font-size="28">Save your work first</text><g class="p"><rect x="100" y="215" width="260" height="70" rx="14" fill="#1e3a8a" stroke="#fde68a" stroke-width="6"/><text x="230" y="261" font-size="32" text-anchor="middle">Scan now</text></g><path d="M400 250H500" stroke="#7dd3fc" stroke-width="7" stroke-linecap="round"/><path d="M480 225L505 250L480 275" fill="none" stroke="#7dd3fc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="620" y="262" font-size="28" text-anchor="middle">Restart</text><text x="100" y="335" font-size="24" style="fill:#94a3b8;font-weight:400">the PC restarts, then scans</text>
</svg>
